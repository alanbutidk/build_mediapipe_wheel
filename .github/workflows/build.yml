name: Build Custom MediaPipe for Arduino Uno Q

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-wheel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout MediaPipe
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/mediapipe
          ref: master

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev \
            libopencv-core-dev libopencv-highgui-dev libopencv-calib3d-dev \
            libopencv-features2d-dev libopencv-imgproc-dev libopencv-video-dev \
            protobuf-compiler

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install numpy pybind11

      - name: Setup Bazelisk
        run: sudo npm install -g @bazel/bazelisk

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-a53-${{ github.sha }}
          restore-keys: bazel-a53-

      - name: Patch for Python 3.13 and Cortex-A53
        run: |
          sed -i 's/python_requires=">=3.9,<3.13"/python_requires=">=3.9,<3.14"/' setup.py || true
          cat >> .bazelrc <<'EOF'
          build --copt=-mcpu=cortex-a53
          build --copt=-O2
          build --copt=-fPIC
          build --define=MEDIAPIPE_DISABLE_GPU=1
          build --linkopt=-Wl,--strip-all
          EOF
      
      - name: Set a valid pkg version
        run: |
          grep -n "__version__" setup.py
          sed -i "s/^__version__ = .*/__version__ = '0.10.0.dev0'/" setup.py
          grep -n "__version__" setup.py

      - name: Build wheel
        run: python setup.py bdist_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-python3.13-cortex_a53
          path: dist/*.whl
